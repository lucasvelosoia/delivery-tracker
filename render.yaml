databases:
  - name: app-db
    plan: free
    databaseName: deliverydb
    user: deliveryuser

services:
  - type: web
    name: delivery-tracker
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
